<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1240" height="790" fill="#FFFFFF"/>

  <!-- Row 1: app -->
  <g font-size="15" text-anchor="middle">
    <rect x="60" y="30" width="240" height="64" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="180" y="58" font-weight="600" fill="#2C2C2A">Responder</text>
    <text x="180" y="78" font-size="12.5" fill="#5F5E5A">incident text · follow-ups · resolve</text>
    <rect x="500" y="30" width="240" height="64" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="620" y="58" font-weight="600" fill="#2C2C2A">Next.js UI</text>
    <text x="620" y="78" font-size="12.5" fill="#5F5E5A">brief · live trace · evidence drawer</text>
    <rect x="940" y="30" width="240" height="64" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="1060" y="58" font-weight="600" fill="#2C2C2A">API routes</text>
    <text x="1060" y="78" font-size="12.5" fill="#5F5E5A">REST + SSE stream</text>
  </g>
  <line x1="302" y1="62" x2="497" y2="62" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="742" y1="62" x2="937" y2="62" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Row 2: deterministic -->
  <rect x="30" y="130" width="1160" height="240" rx="14" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="154" font-size="14" font-weight="600" fill="#0F6E56">Deterministic layer</text>
  <g font-size="15" text-anchor="middle">
    <rect x="60" y="225" width="240" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="180" y="253" font-weight="600" fill="#04342C">Ingest + normalize</text>
    <text x="180" y="273" font-size="12.5" fill="#0F6E56">every item gets a stable ID</text>
    <rect x="500" y="215" width="240" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="620" y="243" font-weight="600" fill="#04342C">Evidence store</text>
    <text x="620" y="263" font-size="12.5" fill="#0F6E56">ALR · LOG · DEP · CFG · MET</text>
    <text x="620" y="281" font-size="12.5" fill="#0F6E56">RB · INC · CHAT · CUST · USER</text>
    <rect x="940" y="170" width="240" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="1060" y="198" font-weight="600" fill="#04342C">Follow-up classifier</text>
    <text x="1060" y="218" font-size="12.5" fill="#0F6E56">evidence · claim · instruction</text>
    <rect x="940" y="280" width="240" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="1060" y="306" font-weight="600" fill="#04342C">Pre-analysis</text>
    <text x="1060" y="325" font-size="12.5" fill="#0F6E56">timeline · change-points · noise</text>
    <text x="1060" y="342" font-size="12.5" fill="#0F6E56">coverage · suspect changes</text>
  </g>
  <line x1="302" y1="257" x2="497" y2="257" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M938 202 H700 V212" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M742 257 H860 V315 H937" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- API to deterministic -->
  <line x1="1060" y1="96" x2="1060" y2="167" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="1070" y="118" font-size="12.5" fill="#444441">follow-up</text>
  <path d="M1182 62 H1205 V315 H1183" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="1199" y="262" font-size="12.5" fill="#444441" text-anchor="end">new incident</text>

  <!-- Row 3: agent -->
  <rect x="30" y="420" width="1160" height="140" rx="14" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="330" y="444" font-size="14" font-weight="600" fill="#534AB7">Agent · max 10 turns · time budget</text>
  <g font-size="15" text-anchor="middle">
    <rect x="60" y="460" width="240" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="180" y="486" font-weight="600" fill="#26215C">Read-only tools</text>
    <text x="180" y="506" font-size="12.5" fill="#534AB7">logs · alerts · changes · metrics</text>
    <text x="180" y="524" font-size="12.5" fill="#534AB7">service context · BM25 knowledge</text>
    <rect x="500" y="467" width="240" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
    <text x="620" y="495" font-weight="600" fill="#26215C">Agent loop</text>
    <text x="620" y="515" font-size="12.5" fill="#534AB7">plan · call tools · update state</text>
    <rect x="940" y="467" width="240" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="1060" y="495" font-weight="600" fill="#26215C">LLM provider</text>
    <text x="1060" y="515" font-size="12.5" fill="#534AB7">Anthropic · Gemini · Replay</text>
  </g>
  <line x1="302" y1="499" x2="497" y2="499" stroke="#444441" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="742" y1="499" x2="937" y2="499" stroke="#444441" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- deterministic to agent -->
  <path d="M1060 352 V386 H660 V464" fill="none" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="860" y="406" font-size="12.5" fill="#444441" text-anchor="middle">seed context (pre-analysis)</text>
  <path d="M180 458 V396 H580 V302" fill="none" stroke="#444441" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="380" y="414" font-size="12.5" fill="#444441" text-anchor="middle">query evidence</text>

  <!-- Row 4: guards + state -->
  <rect x="30" y="610" width="1160" height="140" rx="14" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="634" font-size="14" font-weight="600" fill="#854F0B">Guards + state</text>
  <g font-size="15" text-anchor="middle">
    <rect x="60" y="650" width="240" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="180" y="676" font-weight="600" fill="#412402">Guards</text>
    <text x="180" y="696" font-size="12.5" fill="#854F0B">schema · citations · confidence caps</text>
    <text x="180" y="714" font-size="12.5" fill="#854F0B">risk rubric · finalize gate</text>
    <rect x="500" y="650" width="240" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="620" y="676" font-weight="600" fill="#412402">Enrichment</text>
    <text x="620" y="696" font-size="12.5" fill="#854F0B">similar incidents · repeat incident</text>
    <text x="620" y="714" font-size="12.5" fill="#854F0B">contributing factors</text>
    <rect x="940" y="657" width="240" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="1060" y="685" font-weight="600" fill="#412402">Investigation state</text>
    <text x="1060" y="705" font-size="12.5" fill="#854F0B">JSON on disk · revisions</text>
  </g>
  <line x1="302" y1="692" x2="497" y2="692" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="742" y1="692" x2="937" y2="692" stroke="#444441" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- agent to guards -->
  <path d="M600 533 V580 H180 V647" fill="none" stroke="#444441" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="390" y="598" font-size="12.5" fill="#444441" text-anchor="middle">update / finalize · reject + reminder</text>

  <!-- state back to API (SSE) -->
  <path d="M1182 692 H1225 V16 H1060 V27" fill="none" stroke="#444441" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="1219" y="590" font-size="12.5" fill="#444441" text-anchor="end">SSE: state + trace</text>

  <text x="30" y="776" font-size="12.5" fill="#5F5E5A">Follow-ups reload the saved state and resume the agent loop. Solid = control flow · dashed = reads / streaming.</text>
</svg>
